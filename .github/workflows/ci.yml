name: ci

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend
        run: npm ci --no-audit --no-fund
        working-directory: web

      - name: Build frontend
        run: npm run build
        working-directory: web

      - name: Test server
        run: dotnet test Miaoyan.slnx --configuration Release --logger "console;verbosity=normal"

      # The store image reference is rewritten by prepare-store-image.sh during
      # publishing, so CI allows the repository placeholder but still fails on
      # any other manifest/package regression.
      - name: LazyCat pre-flight
        run: ./scripts/verify-lazycat.sh --allow-placeholder

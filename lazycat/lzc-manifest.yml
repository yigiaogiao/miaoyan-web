application:
  subdomain: miaoyan
  # Each user gets their own container. With document.private this means the
  # app only sees the current user's /lzcapp/documents/<uid> subtree, and
  # /lzcapp/var is isolated per user too. Required for store review: a
  # single-instance app can see every user's private documents folder.
  multi_instance: true
  routes:
    - /=http://miaoyan:5080/
  injects:
    # The gateway can heuristically cache the entry
    # HTML, which would keep old bundles alive after an upgrade. Hashed /assets
    # and API responses are excluded.
    - id: miaoyan-revalidate-html
      auth_required: false
      on: response
      when:
        - /*
      unless:
        - /api
        - /api*
        - /media*
        - /assets*
        - /healthz
      do: |
        ctx.headers.set("Cache-Control", "no-cache, must-revalidate");
    # Store review requires the unified LazyCat file chooser: when the app
    # opens <input type="file">, the user can pick a file from the microserver
    # netdisk or from the local device. Both injects are required; the browser
    # one installs the hooks and the request one bridges shared-directory
    # reads/writes through the app's own origin.
    - id: lazycat-file-bridge
      on: request
      when:
        - /__lazycat_file_bridge/*
      do:
        - src: |
            const bridgePrefix = "/__lazycat_file_bridge";
            const requestHost = String(ctx.request.host || "")
              .split(":")[0]
              .toLowerCase();
            const firstDot = requestHost.indexOf(".");
            const method = String(ctx.request.method || "").toUpperCase();

            if (
              firstDot <= 0 ||
              !requestHost.endsWith(".heiyu.space") ||
              !["GET", "HEAD", "PUT"].includes(method)
            ) {
              ctx.response.send(
                ["GET", "HEAD", "PUT"].includes(method) ? 400 : 405,
                "Invalid LazyCat file bridge request",
              );
              return;
            }

            const boxDomain = requestHost.slice(firstDot + 1);
            const fileOrigin = "https://file." + boxDomain;
            const targetPath =
              "/files/home" + ctx.request.path.slice(bridgePrefix.length);

            ctx.headers.del("Origin");
            ctx.headers.del("Referer");
            ctx.proxy.to(fileOrigin, {
              path: targetPath,
              query: ctx.request.raw_query,
              use_target_host: true,
              timeout_ms: 120000,
              on_fail: "error",
            });
    - id: open-save-chooser
      on: browser
      when:
        - /*
      do:
        - src: file:///lzcapp/pkg/content/lazycat-injects/lzc-file-chooser-inject.js
          params:
            diskRoot: /_lzc/files/home
            fileBridgeRoot: /__lazycat_file_bridge
            fallbackMime: application/octet-stream
            locale: auto
            text:
              zh-CN:
                cloudTab: 网盘文件
                localTab: 本地文件
              en-US:
                cloudTab: Cloud files
                localTab: Local files
            hooks:
              fileSystemAccess: true
              fileInput: true
              downloadAnchor: true

services:
  miaoyan:
    # Replace with the registry.lazycat.cloud reference printed by
    # `lzc-cli appstore copy-image` before submitting to the store.
    # See lazycat/README.md and scripts/prepare-store-image.sh.
    image: registry.lazycat.cloud/u66934985/yigiaogiao/miaoyan-web:22411da2b0684aea
    entrypoint: /usr/local/bin/entrypoint.sh
    # command is a string, not a list (manifest schema: *string).
    command: dotnet MiaoYan.Web.dll
    # Maps /lzcapp persistent directory owners to the container user and makes
    # /lzcapp/documents/<uid> usable. Requires lzcos >= 1.6.0.
    run_as: "1000:1000"
    environment:
      - ASPNETCORE_URLS=http://+:5080
      - DOTNET_EnableDiagnostics=0
      # Per-user state lives under the app's persistent var dir. The vault is
      # resolved from X-HC-User-ID and /lzcapp/documents/<uid>/MiaoYan.
      - MIAOYAN_STATE_DIR=/lzcapp/var/miaoyan
      - MIAOYAN_MAX_UPLOAD_MB=200
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

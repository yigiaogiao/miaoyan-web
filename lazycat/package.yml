package: cloud.lazycat.app.miaoyanweb
version: 1.0.4
name: 妙言笔记
description: A self-hosted Markdown knowledge base inspired by MiaoYan, with plain .md files on your own device.
author: MiaoYan Web contributors
license: MIT
homepage: https://github.com/yigiaogiao/miaoyan-web
# The custom image's entrypoint drops from root to uid 1000, and run_as
# (owner mapping for /lzcapp) needs 1.6.0. On 1.5.x run_as is ignored, so
# /lzcapp/documents would not be writable by the process. Require 1.6.0.
min_os_version: 1.6.0
# Desktop-first layout. The mobile toolbar overflows below 640px, so do not
# advertise the app to phone clients until the responsive top bar is fixed.
unsupported_platforms:
  - ios
  - android

locales:
  zh-CN:
    name: 妙言笔记
    description: 自托管的 Markdown 知识库，笔记就是普通的 .md 文件，数据留在自己的微服上
  en-US:
    name: MiaoYan Notes
    description: A self-hosted Markdown knowledge base where every note is a plain .md file, stored on your own device

permissions:
  required:
    - document.private

package: cloud.lazycat.app.miaoyanweb
version: 0.1.1
name: MiaoYan Web
description: A self-hosted Markdown knowledge base inspired by MiaoYan, with plain .md files on your own device.
author: MiaoYan Web contributors
license: MIT
homepage: https://github.com/yigiaogiao/miaoyan-web
# run_as (owner mapping for /lzcapp) and document.private need this baseline.
min_os_version: 1.6.0

locales:
  zh-CN:
    name: 妙言 Web
    description: 自托管的 Markdown 知识库，笔记就是普通的 .md 文件，数据留在自己的微服上
  en-US:
    name: MiaoYan Web
    description: A self-hosted Markdown knowledge base where every note is a plain .md file, stored on your own device

permissions:
  required:
    - document.private

# Sideload variant that needs no custom image build.
#
# The .NET app is published framework-dependently into ./publish and shipped as
# the LPK content directory (mounted at /lzcapp/pkg/content). The official
# ASP.NET runtime image supplies the runtime, so a machine without Docker can
# still produce a working LPK. PlantUML is disabled because the base image has
# no JRE; the full Dockerfile image keeps PlantUML and ffmpeg.
application:
  subdomain: miaoyan
  # Keep the sideload variant in the same isolation mode as the store build:
  # one container per user, so document.private exposes only that user's
  # /lzcapp/documents/<uid> subtree.
  multi_instance: true
  routes:
    # Route to the service by its name; the fully-qualified form is not the
    # convention LazyCat uses for in-app backends (see the official templates).
    - /=http://miaoyan:5080/
  injects:
    - id: miaoyan-revalidate-html
      auth_required: false
      on: response
      when:
        - /*
      unless:
        - /api
        - /api*
        - /media*
        - /assets*
        - /healthz
      do: |
        ctx.headers.set("Cache-Control", "no-cache, must-revalidate");
    - id: lazycat-file-bridge
      on: request
      when:
        - /__lazycat_file_bridge/*
      do:
        - src: |
            const bridgePrefix = "/__lazycat_file_bridge";
            const requestHost = String(ctx.request.host || "")
              .split(":")[0]
              .toLowerCase();
            const firstDot = requestHost.indexOf(".");
            const method = String(ctx.request.method || "").toUpperCase();

            if (
              firstDot <= 0 ||
              !requestHost.endsWith(".heiyu.space") ||
              !["GET", "HEAD", "PUT"].includes(method)
            ) {
              ctx.response.send(
                ["GET", "HEAD", "PUT"].includes(method) ? 400 : 405,
                "Invalid LazyCat file bridge request",
              );
              return;
            }

            const boxDomain = requestHost.slice(firstDot + 1);
            const fileOrigin = "https://file." + boxDomain;
            const targetPath =
              "/files/home" + ctx.request.path.slice(bridgePrefix.length);

            ctx.headers.del("Origin");
            ctx.headers.del("Referer");
            ctx.proxy.to(fileOrigin, {
              path: targetPath,
              query: ctx.request.raw_query,
              use_target_host: true,
              timeout_ms: 120000,
              on_fail: "error",
            });
    - id: open-save-chooser
      on: browser
      when:
        - /*
      do:
        - src: file:///lzcapp/pkg/content/lazycat-injects/lzc-file-chooser-inject.js
          params:
            diskRoot: /_lzc/files/home
            fileBridgeRoot: /__lazycat_file_bridge
            fallbackMime: application/octet-stream
            locale: auto
            text:
              zh-CN:
                cloudTab: 网盘文件
                localTab: 本地文件
              en-US:
                cloudTab: Cloud files
                localTab: Local files
            hooks:
              fileSystemAccess: true
              fileInput: true
              downloadAnchor: true

services:
  miaoyan:
    image: mcr.microsoft.com/dotnet/aspnet:10.0
    entrypoint: /usr/bin/dotnet
    # command is a string, not a list (manifest schema: *string). A YAML list
    # here is rejected at install time.
    command: /lzcapp/pkg/content/MiaoYan.Web.dll
    run_as: "1000:1000"
    environment:
      - ASPNETCORE_URLS=http://+:5080
      # The published app lives in the content directory; without this the
      # process starts from the image WORKDIR and cannot find wwwroot.
      - ASPNETCORE_CONTENTROOT=/lzcapp/pkg/content
      - DOTNET_EnableDiagnostics=0
      - HOME=/tmp
      - MIAOYAN_STATE_DIR=/lzcapp/var/miaoyan
      - MIAOYAN_MAX_UPLOAD_MB=200
      - MIAOYAN_PLANTUML_JAR=
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/5080
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
